# Publish @userelay/sdk and @userelay/cli to npm.
#
# ── Why this runs in CI and not on a laptop ─────────────────────────────────
#
# npm's trusted publishing authenticates this workflow to the registry over
# OIDC, so there is no NPM_TOKEN here and none in the repository secrets. A
# token that does not exist cannot leak from a laptop, a shell history or a
# CI log.
#
# It also attaches provenance automatically: a Sigstore-signed attestation,
# recorded in a public transparency log, binding each published version to the
# exact repository, workflow and commit that produced it. Anyone can check that
# the code on npm is the code in this repo — which is the whole point of
# publishing the client under Apache-2.0 while the service stays private.
#
# ── Setup, once per package, on npmjs.com ───────────────────────────────────
#
#   Package settings → Trusted Publisher → GitHub Actions
#     Organization or user: gecit-labs
#     Repository:           sdk
#     Workflow filename:    publish.yml
#
# npm does not validate that configuration when you save it, so a mistake only
# shows up as a failed publish. A new configuration also has to complete one
# successful publish within two days or it expires.
#
# ── Order is not optional ───────────────────────────────────────────────────
#
# The CLI depends on the SDK at the version being released, so the SDK has to
# be on the registry before the CLI is published. These are separate steps in
# one job, in that order, for exactly that reason.

name: publish

on:
  workflow_dispatch:
    inputs:
      packages:
        description: What to publish
        type: choice
        default: both
        options: [both, sdk, cli]
      dry_run:
        description: Pack and verify without publishing
        type: boolean
        default: false

permissions:
  contents: read
  # The critical one. Without it the OIDC exchange cannot happen and npm falls
  # back to looking for a token that is deliberately not here.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # The SDK's test script is `bun test`, and ubuntu-latest has no bun.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # setup-node ships npm 10.x; trusted publishing needs 11.5.1 or later.
      - name: Use an npm that can do OIDC
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Publish @userelay/sdk
        if: inputs.packages == 'both' || inputs.packages == 'sdk'
        run: npm publish --workspace=@userelay/sdk ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Publish @userelay/cli
        if: inputs.packages == 'both' || inputs.packages == 'cli'
        run: npm publish --workspace=@userelay/cli ${{ inputs.dry_run && '--dry-run' || '' }}
