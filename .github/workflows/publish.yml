# Stage @userelay/sdk and @userelay/cli for release.
#
# ── This workflow cannot publish anything ───────────────────────────────────
#
# It stages. A staged version is uploaded, signed and inspectable, and it is
# not on the registry until a maintainer approves it with 2FA. Nothing a
# compromised workflow can do results in a package the world can install.
#
# That is npm's recommended posture, and it is the same shape as the product:
# the automation does the work and a human signs off before anything lands.
# A release process that contradicted our own approval gate would be a strange
# thing to ship.
#
# ── No token, and provenance for free ───────────────────────────────────────
#
# npm authenticates this workflow over OIDC, so there is no NPM_TOKEN here and
# none in repository secrets. A token that does not exist cannot leak. Trusted
# publishing also attaches provenance automatically — a Sigstore-signed
# attestation, recorded in a public transparency log, binding each version to
# the repository, workflow and commit that produced it. No --provenance flag
# is needed or wanted.
#
# ── Setup, once per package, on npmjs.com ───────────────────────────────────
#
#   Package settings → Trusted Publisher → GitHub Actions
#     Organization or user: gecit-labs
#     Repository:           sdk
#     Workflow filename:    publish.yml
#
# `npm stage publish` is permitted by default, so Allowed actions needs no
# change. npm does not validate the configuration when you save it, so a
# mistake surfaces only as a failed run.
#
# ── After a run ─────────────────────────────────────────────────────────────
#
# The final step prints the stage ids. Approve from npmjs.com, or with a local
# npm 12 or later:
#
#   npm stage view <stage-id>       # inspect before trusting it
#   npm stage approve <stage-id>    # requires 2FA; this is the publish
#   npm stage reject <stage-id>     # also 2FA
#
# The dist-tag is fixed at stage time. Changing it means reject and re-stage.

name: publish

on:
  workflow_dispatch:
    inputs:
      packages:
        description: What to stage
        type: choice
        default: both
        options: [both, sdk, cli]
      dry_run:
        description: Build and pack only — stage nothing
        type: boolean
        default: false

permissions:
  contents: read
  # The critical one. Without it the OIDC exchange cannot happen and npm falls
  # back to looking for a token that is deliberately not here.
  id-token: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # The SDK's test script is `bun test`, and ubuntu-latest has no bun.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # setup-node ships npm 10.x. Trusted publishing needs 11.5.1+, and the
      # `stage` subcommand only exists from npm 12.
      - name: Use an npm that can stage
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci
      - run: npm run build
      - run: npm test

      # Run inside each package rather than with --workspace: npm's own docs
      # say `stage` "is unaware of workspaces" while still listing the flag,
      # and a release is the wrong place to find out which is true.
      - name: Stage @userelay/sdk
        if: inputs.packages == 'both' || inputs.packages == 'sdk'
        working-directory: packages/sdk
        run: npm stage publish ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Stage @userelay/cli
        if: inputs.packages == 'both' || inputs.packages == 'cli'
        working-directory: packages/cli
        run: npm stage publish ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Stage ids to approve
        if: ${{ !inputs.dry_run }}
        run: |
          npm stage list @userelay/sdk || true
          npm stage list @userelay/cli || true
